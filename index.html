<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>JMS Ar Condicionado - Gerador de Orçamentos</title>
    <!-- Biblioteca jsPDF para geração do PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #334155; }
        .container { max-width: 850px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: auto; }
        h2 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; font-size: 20px; }
        h3 { color: #1e293b; font-size: 16px; margin-top: 25px; border-left: 4px solid #0f172a; padding-left: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; box-sizing: border-box; background: #f8fafc; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button { background: #0f172a; color: #fff; border: none; padding: 12px 20px; font-size: 15px; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1e293b; }
        button.btn-whatsapp { background: #16a34a; }
        button.btn-whatsapp:hover { background: #15803d; }
        button.btn-email { background: #2563eb; }
        button.btn-email:hover { background: #1d4ed8; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>JMS Ar Condicionado e Refrigeração — Gerador Inteligente</h2>
    
    <!-- 1. DADOS DO CLIENTE -->
    <h3>1. Dados do Cliente</h3>
    <div class="form-group">
        <label>Nome / Razão Social</label>
        <input type="text" id="cliNome" placeholder="Ex: Nome do Cliente ou Condomínio">
    </div>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Telefone / WhatsApp</label>
                <input type="text" id="cliFone" placeholder="(71) 99999-9999">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>E-mail do Cliente (Opcional)</label>
                <input type="email" id="cliEmail" placeholder="cliente@email.com">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Endereço Completo</label>
                <input type="text" id="cliEndereco" placeholder="Rua, Número, Bairro, Cidade">
            </div>
        </div>
        <div class="col" style="max-width: 150px;">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cliCep" placeholder="42800-000">
            </div>
        </div>
    </div>

    <!-- 2. EQUIPAMENTO E SERVIÇO -->
    <h3>2. Especificação do Aparelho & Serviço</h3>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Capacidade e Bitola (Base de Cobre)</label>
                <select id="capacidadeBtu" onchange="atualizarParametrosPorBtu()">
                    <option value="9000">Split 9.000 BTUs (Cobre 1/4" x 3/8")</option>
                    <option value="12000" selected>Split 12.000 BTUs (Cobre 1/4" x 1/2")</option>
                    <option value="18000">Split 18.000 BTUs (Cobre 1/4" x 5/8")</option>
                    <option value="24000">Split 24.000 BTUs (Cobre 3/8" x 5/8")</option>
                </select>
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Complexidade / Nível de Mão de Obra</label>
                <select id="complexidadeServico" onchange="calcularValoresAutomaticos()">
                    <option value="padrao">Instalação Padrão (Até 3m / Acessível)</option>
                    <option value="complexa">Instalação Complexa (Andares / Altura / Dificuldade)</option>
                    <option value="manutencao">Manutenção / Higienização Especializada</option>
                </select>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Metros Excedentes de Tubulação (Além dos 3m padrão)</label>
                <input type="number" id=" metrosExcedentes" value="0" min="0" oninput="calcularValoresAutomaticos()">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Preço Base Referência do Cobre (kg / metro)</label>
                <input type="number" id="precoCobre" value="35.00" oninput="calcularValoresAutomaticos()">
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="forneceEquipamento">
            <label for="forneceEquipamento" style="margin:0; cursor:pointer;">Fornecimento de Equipamento Novo pela JMS</label>
        </div>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="incluiKit" checked onchange="toggleKitCampos()">
            <label for="incluiKit" style="margin:0; cursor:pointer;">Incluir Kit Completo (Tubulação, Isolamento Térmico e Cabo PP)</label>
        </div>
    </div>

    <!-- 3. DISCRIMINAÇÃO FINANCEIRA CALCULADA -->
    <h3>3. Discriminação Financeira</h3>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Valor Mão de Obra (R$)</label>
                <input type="number" id="valServico" value="400.00">
            </div>
        </div>
        <div class="col" id="blocoKitValor">
            <div class="form-group">
                <label>Valor Kit Padrão / Materiais (R$)</label>
                <input type="number" id="valKit" value="220.00">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Valor Tubulação Excedente (R$)</label>
                <input type="number" id="valExcedente" value="0.00">
            </div>
        </div>
    </div>

    <!-- BOTÕES DE AÇÃO RÁPIDA -->
    <div class="btn-group">
        <button onclick="gerarPDFJMS()">Gerar PDF Minimalista</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar WhatsApp</button>
        <button class="btn-email" onclick="enviarEmail()">Enviar E-mail</button>
    </div>
</div>

<script>
    function atualizarParametrosPorBtu() {
        const btu = document.getElementById('capacidadeBtu').value;
        const kitInput = document.getElementById('valKit');
        
        // Ajuste automático estimado do kit base (incluindo tubos, isolamento e cabo PP compatível)
        if (btu === '9000') kitInput.value = '190.00';
        else if (btu === '12000') kitInput.value = '220.00';
        else if (btu === '18000') kitInput.value = '320.00';
        else if (btu === '24000') kitInput.value = '480.00';
        
        calcularValoresAutomaticos();
    }

    function calcularValoresAutomaticos() {
        const btu = document.getElementById('capacidadeBtu').value;
        const complexidade = document.getElementById('complexidadeServico').value;
        const metros = parseFloat(document.getElementById('metrosExcedentes').value) || 0;
        const precoBaseCobre = parseFloat(document.getElementById('precoCobre').value) || 35.00;
        
        // Mão de obra base ajustada por complexidade
        let maoObra = 400;
        if (complexidade === 'complexa') maoObra = 550;
        if (complexidade === 'manutencao') maoObra = 300;
        if (btu === '18000') maoObra += 100;
        if (btu === '24000') maoObra += 200;
        document.getElementById('valServico').value = maoObra.toFixed(2);

        // Fator de bitola para tubulação excedente (quanto maior a capacidade, mais encarece o metro excedente)
        let multiplicadorBitola = 1.0;
        if (btu === '12000') multiplicadorBitola = 1.2;
        if (btu === '18000') multiplicadorBitola = 1.5;
        if (btu === '24000') multiplicadorBitola = 2.0;

        let valorExcedenteMetro = precoBaseCobre * multiplicadorBitola;
        let totalExcedente = metros * valorExcedenteMetro;
        document.getElementById('valExcedente').value = totalExcedente.toFixed(2);
    }

    function toggleKitCampos() {
        const inclui = document.getElementById('incluiKit').checked;
        document.getElementById('blocoKitValor').style.display = inclui ? 'block' : 'none';
    }

    function construirPDFDoc() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const nome = document.getElementById('cliNome').value || "Cliente Não Informado";
        const fone = document.getElementById('
