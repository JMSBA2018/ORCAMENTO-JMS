<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS Ar Condicionado - Gerador de Orçamentos</title>
    <!-- Biblioteca jsPDF via CDN oficial estável -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0f172a; margin: 0; padding: 15px; color: #f8fafc; }
        .container { max-width: 800px; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin: auto; border: 1px solid #334155; }
        h2 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; font-size: 18px; }
        h3 { color: #e2e8f0; font-size: 15px; margin-top: 20px; border-left: 4px solid #38bdf8; padding-left: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #94a3b8; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 4px; font-size: 14px; box-sizing: border-box; background: #0f172a; color: #fff; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px; font-size: 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button.btn-whatsapp { background: #22c55e; color: #fff; }
        button.btn-pdf { background: #0284c7; color: #fff; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>JMS Ar Condicionado — Orçamentos</h2>
    
    <!-- 1. DADOS DO CLIENTE -->
    <h3>1. Dados do Cliente</h3>
    <div class="form-group">
        <label>Nome do Cliente</label>
        <input type="text" id="cliNome" placeholder="Ex: Tadeu Humberto">
    </div>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>WhatsApp / Telefone</label>
                <input type="text" id="cliFone" placeholder="(71) 99999-9999">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>CPF / CNPJ (Opcional)</label>
                <input type="text" id="cliDoc" placeholder="Opcional">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col" style="max-width: 150px;">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cliCep" placeholder="42800-000" maxlength="9" onblur="consultarCep(this.value)">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Endereço Completo</label>
                <input type="text" id="cliEndereco" placeholder="Rua, Bairro, Nº, Cidade">
            </div>
        </div>
    </div>

    <!-- 2. APARELHO E SERVIÇO -->
    <h3>2. Aparelho & Serviço</h3>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Capacidade</label>
                <select id="capacidadeBtu">
                    <option value="9.000 BTU/h">9.000 BTU/h</option>
                    <option value="12.000 BTU/h">12.000 BTU/h</option>
                    <option value="18.000 BTU/h" selected>18.000 BTU/h</option>
                    <option value="24.000 BTU/h">24.000 BTU/h</option>
                </select>
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Tubulação Cobre Total (m)</label>
                <input type="number" id="metrosCobre" value="5.0" step="0.5">
            </div>
        </div>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="chkInstalacao" checked>
            <label for="chkInstalacao" style="margin:0; cursor:pointer;">Instalação Técnica Padrão (R$ 350,00)</label>
        </div>
    </div>
    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="chkSuporte" checked>
            <label for="chkSuporte" style="margin:0; cursor:pointer;">Fornecer Suporte para Condensadora + Coxins (R$ 130,00)</label>
        </div>
    </div>

    <!-- 3. VALORES -->
    <h3>3. Valores</h3>
    <div class="row">
        <div class="col">
            <div class="form-group">
                <label>Valor Mão de Obra (R$)</label>
                <input type="number" id="valmaoObra" value="350.00">
            </div>
        </div>
        <div class="col">
            <div class="form-group">
                <label>Valor dos Materiais / Kit (R$)</label>
                <input type="number" id="valMateriais" value="680.00">
            </div>
        </div>
    </div>

    <!-- BOTÕES DE AÇÃO -->
    <div class="btn-group">
        <button class="btn-pdf" onclick="gerarPDFJMS()">Gerar e Baixar PDF Oficial</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar Orçamento via WhatsApp</button>
    </div>
</div>

<script>
    // Função para buscar o endereço automaticamente pelo CEP usando a API ViaCEP
    function consultarCep(cep) {
        let cepLimpo = cep.replace(/\D/g, '');
        if (cepLimpo.length !== 8) return;

        fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    let enderecoCompleto = `${data.logradouro}, Bairro: ${data.bairro}, ${data.localidade} - ${data.uf} (CEP: ${data.cep})`;
                    document.getElementById('cliEndereco').value = enderecoCompleto;
                } else {
                    alert("CEP não encontrado.");
                }
            })
            .catch(error => {
                console.error("Erro ao buscar CEP:", error);
            });
    }

    // Função central para gerar o PDF perfeitamente formatado
    function criarInstanciaPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const nome = document.getElementById('cliNome').value || "Cliente Não Identificado";
        const fone = document.getElementById('cliFone').value || "Não informado";
        const docCli = document.getElementById('cliDoc').value || "Não informado";
        const endereco = document.getElementById('cliEndereco').value || "Não informado";
        const btu = document.getElementById('capacidadeBtu').value;
        const metros = document.getElementById('metrosCobre').value;

        const maoObra = parseFloat(document.getElementById('valmaoObra').value) || 0;
        const materiais = parseFloat(document.getElementById('valMateriais').value) || 0;
        const total = maoObra + materiais;

        // Cabeçalho Empresa
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(14);
        doc.setTextColor(15, 23, 42);
        doc.text("JMS AR CONDICIONADO E REFRIGERAÇÃO", 15, 18);

        doc.setFont("Helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(100, 100, 100);
        doc.text("Instalação, Manutenção e Assistência Técnica Especializada", 15, 23);
        doc.text("Camaçari - Bahia | CNPJ: 29.694.983/0001-95 | Tel: (71) 99683-6999", 15, 28);

        // Proposta Info
        doc.setFont("Helvetica", "bold");
        doc.text("Orçamento Nº: JMS-202610", 135, 18);
        doc.setFont("Helvetica", "normal");
        doc.text("Data: " + new Date().toLocaleDateString('pt-BR'), 135, 23);

        doc.setDrawColor(200, 200, 200);
        doc.line(15, 34, 195, 34);

        // Dados do Cliente
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(10);
        doc.text("INFORMAÇÕES DO CLIENTE", 15, 42);
        doc.setFont("Helvetica", "normal");
        doc.setFontSize(9);
        doc.text(`Cliente: ${nome}`, 15, 49);
        doc.text(`WhatsApp: ${fone}`, 15, 55);
        doc.text(`Endereço: ${endereco}`, 15, 61);
        doc.text(`Documento: ${docCli}`, 15, 67);

        // Serviços
        doc.setFont("Helvetica", "bold");
        doc.text("1. MÃO DE OBRA E SERVIÇOS TÉCNICOS", 15, 78);
        doc.setFont("Helvetica", "normal");
        doc.text(`• Instalação Padrão (${btu} Inverter) — R$ ${maoObra.toFixed(2)}`, 18, 85);

        // Materiais
        doc.setFont("Helvetica", "bold");
        doc.text("2. FORNECIMENTO DE MATERIAIS E INSUMOS", 15, 96);
        doc.setFont("Helvetica", "normal");
        doc.text(`• Kit Tubulação de Cobre Isolada (${metros}m) + Suporte — R$ ${materiais.toFixed(2)}`, 18, 103);

        // Total
        doc.setDrawColor(200, 200, 200);
        doc.line(15, 112, 195, 112);
        doc.setFont("Helvetica", "bold");
        doc.setFontSize(12);
        doc.text(`VALOR TOTAL DO ORÇAMENTO: R$ ${total.toFixed(2)}`, 15, 122);

        // Rodapé
        doc.setFont("Helvetica", "normal");
        doc.setFontSize(8.5);
        doc.text("Condição de Pagamento: PIX / Dinheiro à Vista (Chave PIX CNPJ: 29.694.983/0001-95)", 15, 132);
        doc.text("Garantia: 90 dias sobre a execução dos serviços prestados pela JMS.", 15, 138);
        doc.text("Técnico Responsável: José Manoel dos Santos", 15, 144);

        return { doc, nome, total };
    }

    // Botão de Gerar PDF
    function gerarPDFJMS() {
        try {
            const resultado = criarInstanciaPDF();
            resultado.doc.save("Orcamento_JMS_" + resultado.nome.replace(/[^a-zA-Z0-9]/g, "_") + ".pdf");
        } catch (err) {
            alert("Erro ao gerar o PDF. Verifique os dados inseridos.");
        }
    }

    // Botão do WhatsApp (Aviso sobre envio de PDF no WhatsApp Web/Mobile)
    function enviarWhatsApp() {
        const nome = document.getElementById('cliNome').value || "Cliente";
        const fone = document.getElementById('cliFone').value.replace(/\D/g, '') || "";
        const resultado = criarInstanciaPDF();

        // Salva o PDF localmente no telemóvel para o usuário poder anexar
        resultado.doc.save("Orcamento_JMS_" + resultado.nome.replace(/[^a-zA-Z0-9]/g, "_") + ".pdf");

        // Mensagem de texto formatada orientando a anexação do arquivo PDF baixado
        const texto = encodeURIComponent(`Olá ${nome}, segue o orçamento oficial da JMS Ar Condicionado e Refrigeração.\n\n*Valor Total:* R$ ${resultado.total.toFixed(2)}\n\n*(O arquivo PDF detalhado acabou de ser descarregado no seu telemóvel e pode ser anexado aqui).*`);

        const url = fone ? `https://wa.me/55${fone}?text=${texto}` : `https://api.whatsapp.com/send?text=${texto}`;
        
        setTimeout(() => {
            window.open(url, '_blank');
        }, 400);
    }
</script>

</body>
</html>
