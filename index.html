<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS Ar Condicionado e Refrigeração - Sistema de Orçamentos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-2 sm:p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Cabeçalho -->
        <header class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4 no-print">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-cyan-400 tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-snowflake"></i> JMS Ar Condicionado
                </h1>
                <p class="text-xs text-slate-400">Sistema Profissional de Orçamentos Técnicos</p>
            </div>
            <button onclick="abrirConfig()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition border border-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> Tabela de Preços e Equipe
            </button>
        </header>

        <!-- Formulário Principal -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6 no-print">
            <!-- Dados do Cliente e Equipamento -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-cyan-400"></i> Dados do Cliente & Equipamento
                </h2>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Cliente / Razão Social</label>
                    <input type="text" id="cliNome" oninput="calcular()" placeholder="Ex: Tadeu Humberto" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp / Telefone</label>
                        <input type="text" id="cliTel" maxlength="15" oninput="mascaraTelefone(this)" placeholder="(71) 99999-9999" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">CPF / CNPJ</label>
                        <input type="text" id="cliDoc" placeholder="Opcional" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-xs font-semibold text-slate-300 mb-1">CEP (Busca)</label>
                        <input type="text" id="cliCep" maxlength="9" oninput="mascaraCep(this)" placeholder="42800-000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-cyan-400 font-bold focus:border-cyan-400 outline-none">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Endereço Completo</label>
                        <input type="text" id="cliEnd" oninput="calcular()" placeholder="Rua, Bairro, Nº" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Marca</label>
                        <select id="eqMarca" onchange="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                            <option value="Elgin">Elgin</option>
                            <option value="Gree">Gree</option>
                            <option value="LG">LG</option>
                            <option value="Midea">Midea</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Daikin">Daikin</option>
                            <option value="Consul">Consul</option>
                            <option value="Electrolux">Electrolux</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Capacidade</label>
                        <select id="eqCap" onchange="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                            <option value="9000">9.000 BTU/h</option>
                            <option value="12000">12.000 BTU/h</option>
                            <option value="18000" selected>18.000 BTU/h</option>
                            <option value="24000">24.000 BTU/h</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tecnologia</label>
                        <select id="eqTec" onchange="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                            <option value="Inverter">Inverter</option>
                            <option value="Convencional">Convencional</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo</label>
                        <select id="eqTipo" onchange="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                            <option value="Split Wall">Split Wall</option>
                            <option value="Piso Teto">Piso Teto</option>
                            <option value="Cassete">Cassete</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Seleção de Serviços, Pagamento e Desconto -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cyan-400"></i> Serviços, Desconto & Pagamento
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Tubulação Cobre (m)</label>
                        <input type="number" id="infMetragem" value="5.0" step="0.5" min="1" oninput="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                        <span id="txtPreCarga" class="text-[10px] text-cyan-400 mt-1 block">Incluso até 5.0m</span>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Desconto Aplicado (R$)</label>
                        <input type="number" id="valDesconto" value="0" min="0" step="5" oninput="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-cyan-400 font-bold focus:border-cyan-400 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Forma de Pagamento</label>
                    <select id="selPagamento" onchange="calcular()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:border-cyan-400 outline-none">
                        <option value="PIX / Dinheiro à Vista (5% Desconto)">PIX / Dinheiro à Vista</option>
                        <option value="Cartão de Crédito - 2x sem juros">Cartão de Crédito - 2x sem juros</option>
                        <option value="Cartão de Crédito - Até 10x">Cartão de Crédito - Até 10x</option>
                        <option value="Transferência Bancária / TED">Transferência Bancária / TED</option>
                        <option value="Faturamento para Empresas (Boleto)">Faturamento para Empresas (Boleto)</option>
                    </select>
                </div>

                <div class="space-y-1 pt-1">
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wide">Serviços de Mão de Obra:</label>
                    <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 space-y-1 text-xs max-h-32 overflow-y-auto">
                        <label class="flex items-center gap-2 p-1 hover:bg-slate-800 rounded cursor-pointer">
                            <input type="checkbox" id="srvInstalacao" checked onchange="calcular()" class="accent-cyan-400"> Instalação Padrão (Técnico + Ajudante)
                        </label>
                        <label class="flex items-center gap-2 p-1 hover:bg-slate-800 rounded cursor-pointer">
                            <input type="checkbox" id="srvHigLocal" onchange="calcular()" class="accent-cyan-400"> Higienização Preventiva (No Local)
                        </label>
                        <label class="flex items-center gap-2 p-1 hover:bg-slate-800 rounded cursor-pointer">
                            <input type="checkbox" id="srvPlaca" onchange="calcular()" class="accent-cyan-400"> Reparo em Placa Eletrônica
                        </label>
                        <label class="flex items-center gap-2 p-1 hover:bg-slate-800 rounded cursor-pointer">
                            <input type="checkbox
